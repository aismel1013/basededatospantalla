<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Producto - Ferretería Bellón</title>
  <link rel="stylesheet" href="producto.css">
</head>
<body>

<div class="contenedor">

  <div class="barra-titulo">
    <h1>Producto</h1>
  </div>

  <div class="cuerpo">

    <div class="formulario">
      <div class="titulo-formulario">Registro de producto</div>

      <div class="campos">

        <div class="campo">
          <label>ID Producto</label>
          <input type="text" id="id_producto" placeholder="Autogenerado" readonly>
        </div>

        <div class="campo">
          <label>Id_categoria</label>
          <input type="number" id="categoria" placeholder="id de la categoria">
        </div>

        <div class="campo">
          <label>Nombre</label>
          <input type="text" id="nombre" placeholder="Nombre del producto">
        </div>

        <div class="dos-columnas">
          <div class="campo">
            <label>Precio</label>
            <input type="number" id="precio" placeholder="0.00" min="0">
          </div>
          <div class="campo">
            <label>Costo</label>
            <input type="number" id="costo" placeholder="0.00" min="0">
          </div>
        </div>

        <div class="dos-columnas">
          <div class="campo">
            <label>Tipo</label>
            <input type="text" id="tipo_producto" placeholder="Tipo">
          </div>
        </div>

        <div class="campo">
          <label>Descripción</label>
          <textarea id="descripcion" placeholder="Descripción del producto..."></textarea>
        </div>

      </div>

      <div class="botones-formulario">
        <button type="button" class="boton boton-guardar" id="btn-guardar">Guardar</button>
        <button type="button" class="boton boton-limpiar" id="btn-limpiar">Limpiar</button>
      </div>
    </div>

  </div>
</div>

<script src="appdeproductos.js"></script>

</body>
</html>
