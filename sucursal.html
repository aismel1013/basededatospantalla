<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de sucursal - Ferretería Bellón</title>
  <link rel="stylesheet" href="sucursal.css">
</head>
<body>

<div class="contenedor">

  <div class="barra-titulo">
    <h1>Ferretería Bellón</h1>
  </div>

  <div class="cuerpo">

    <div class="formulario">
      <div class="titulo-formulario">Registro de datos para la sucursal</div>

      <div class="campos">

        <div class="campo">
          <label>ID sucursal (Manual)</label>
          <input type="number" id="id_sucursal" placeholder="Ej. 1">
        </div>

        <div class="campo">
          <label>Nombre</label>
          <input type="text" id="nombre" placeholder="Nombre de la sucursal">
        </div>

        <div class="campo">
          <label>Dirección</label>
          <textarea id="direccion" placeholder="Dirección de la sucursal..."></textarea>
        </div>

        <div class="campo">
          <label>Teléfono</label>
          <input type="text" id="telefono" placeholder="Número de teléfono">
        </div>

      </div>

      <div class="botones-formulario">
        <button type="button" class="boton boton-guardar" id="btn-guardar">Guardar</button>
        <button type="button" class="boton boton-limpiar" id="btn-limpiar">Limpiar</button>
      </div>
    </div>

  </div>
</div>

<script src="index.js"></script>

</body>
</html>
